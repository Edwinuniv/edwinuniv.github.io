<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7b4a">
<title>Sadik – Share the ride to USJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cedar:#0f7b4a; --cedar-dark:#0a5534; --cedar-soft:#eaf6ef; --red:#e63946; --red-soft:#fdeaec;
  --cream:#fdf8f0; --ink:#1b1b1b; --muted:#6b7280; --card:#ffffff; --line:#ece6da; --amber:#f4a72a;
  --radius:18px; --shadow:0 4px 18px rgba(16,24,40,.06); --tab-h:66px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input{font-family:inherit;font-size:16px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.3rem;color:var(--cedar);letter-spacing:-.01em}
.brand .logo{width:36px;height:36px;border-radius:11px;background:var(--cedar);display:grid;place-items:center;font-size:1.1rem}
.brand em{color:var(--red);font-style:normal}

/* ====================== PHONE APP ====================== */
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;background:var(--cream)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;padding-top:calc(14px + env(safe-area-inset-top));background:rgba(253,248,240,.92);backdrop-filter:blur(10px)}
.topbar .right{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.8rem}
.pill.plus{background:var(--red-soft);color:var(--red)}
.pill.get{border:2px solid var(--red);color:var(--red);background:#fff}
.pill.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
#view{padding:4px 18px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom))}
.enter{animation:enter .28s ease}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);height:calc(var(--tab-h) + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:600;color:#9aa1ab;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--cedar)}
.tab .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:.65rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

h1.title{font-size:1.55rem;line-height:1.2;letter-spacing:-.02em;margin:6px 0 2px}
h2.section{font-size:1rem;margin:22px 2px 10px;display:flex;align-items:center;justify-content:space-between}
h2.section .link{font-size:.82rem}
.link{color:var(--cedar);font-weight:600}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:10px}

/* search card */
.search{margin-top:14px;padding:6px 16px}
.search .row{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.search .row+.row{border-top:1px solid var(--line)}
.search .dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--cedar);flex-shrink:0}
.search .dot.end{background:var(--red);border-color:var(--red)}
.search .lbl{font-size:.72rem;color:var(--muted);font-weight:500}
.search .val{font-weight:700}
.search .chev{margin-left:auto;color:#b6bcc4}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.88rem;white-space:nowrap}
.chip.on{background:var(--cedar);border-color:var(--cedar);color:#fff}
.chip.lock{color:var(--muted)}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* ride card */
.ride{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);transition:transform .12s}
.ride:active{transform:scale(.98)}
.ride .time{font-size:1.25rem;font-weight:800;color:var(--cedar-dark);line-height:1}
.ride .time small{display:block;font-size:.68rem;font-weight:500;color:var(--muted);margin-top:4px}
.ride .who{display:flex;align-items:center;gap:8px;font-weight:700}
.ride .route{font-size:.82rem;color:var(--muted);margin-top:2px}
.ride .note{font-size:.78rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.ride .rside{text-align:right}
.seatdots{display:flex;gap:3px;justify-content:flex-end}
.seatdots i{width:10px;height:10px;border-radius:3px;background:var(--cedar)}
.seatdots i.free{background:#fff;border:2px solid var(--cedar)}
.status{display:inline-block;margin-top:6px;font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 9px}
.status.ok{background:var(--cedar-soft);color:var(--cedar-dark)}
.status.full{background:#f1f1f1;color:var(--muted)}
.status.mine{background:var(--red-soft);color:var(--red)}
.tagv{display:inline-flex;align-items:center;font-size:.66rem;font-weight:700;color:var(--cedar);background:var(--cedar-soft);border-radius:6px;padding:1px 6px}

.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:.78rem;flex-shrink:0;position:relative}
.av.lg{width:64px;height:64px;font-size:1.4rem}
.av.md{width:40px;height:40px;font-size:.95rem}
.av.star::after{content:"⭐";position:absolute;right:-5px;bottom:-4px;font-size:.62rem}
.av.lg.star::after{font-size:1rem;right:-3px;bottom:-2px}
.avstack{display:flex}
.avstack .av{width:24px;height:24px;font-size:.62rem;border:2px solid #fff;margin-left:-6px}
.avstack .av:first-child{margin-left:0}

/* empty / info */
.empty{text-align:center;padding:26px 18px}
.empty .big{font-size:2.4rem;margin-bottom:6px}
.empty h3{font-size:1.05rem}
.empty p{color:var(--muted);font-size:.9rem;margin:4px 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:700;font-size:.98rem}
.btn.block{display:flex;width:100%}
.btn.primary{background:var(--red);color:#fff}
.btn.green{background:var(--cedar);color:#fff}
.btn.soft{background:var(--cedar-soft);color:var(--cedar-dark)}
.btn.line{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn.danger{background:#fff;border:2px solid var(--red);color:var(--red)}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.98)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.waiting{display:flex;gap:12px;align-items:center;background:#fff8e8;border:1px solid #f6dfa8;border-radius:var(--radius);padding:14px}
.waiting .ico{font-size:1.5rem}
.waiting b{display:block}
.req{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.req .info{flex:1}
.req .info b{display:block;font-size:.92rem}

/* forms */
.field{margin-bottom:18px}
.field>label{display:block;font-weight:700;margin-bottom:8px}
.text{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff}
.text:focus{outline:none;border-color:var(--cedar)}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:left}
.pick .chev{margin-left:auto;color:#b6bcc4}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .chip{text-align:center}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:50%;border:2px solid var(--cedar);color:var(--cedar);font-size:1.4rem;font-weight:700;display:grid;place-items:center}
.stepper button:disabled{opacity:.3}
.stepper .n{font-size:1.6rem;font-weight:800;min-width:30px;text-align:center}
.lockrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:14px;padding:13px 14px;border:2px dashed #f2c3c7}
.lockrow .t{flex:1}
.lockrow .t b{display:block;font-size:.92rem}
.lockrow .t span{font-size:.78rem;color:var(--muted)}
.switch{width:46px;height:28px;border-radius:14px;background:#d9dde2;position:relative;flex-shrink:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--cedar)}
.switch.on::after{left:21px}
.lockrow.unlocked{border:2px solid var(--line)}
.hint{display:flex;gap:10px;align-items:center;background:var(--red-soft);color:#9b1c27;border-radius:14px;padding:12px 14px;font-size:.88rem;font-weight:600;margin-bottom:18px}

/* onboarding */
.onb{min-height:100dvh;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom))}
.onb .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:16px 0 26px}
.onb .bar i{display:block;height:100%;background:var(--cedar);transition:width .3s}
.onb h1{font-size:1.65rem;line-height:1.2;letter-spacing:-.02em}
.onb p.sub{color:var(--muted);margin:6px 0 20px}
.onb .body{flex:1}
.onb .foot{display:flex;gap:10px;margin-top:18px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.hero .art{font-size:4rem;margin-bottom:10px}
.hero h1{font-size:2rem}
.hero p{color:var(--muted);margin:10px auto 0;max-width:320px}
.zonelist{display:grid;gap:8px}
.zone{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff}
.zone b{display:block}
.zone span{font-size:.78rem;color:var(--muted)}
.zone.on{border-color:var(--cedar);background:var(--cedar-soft)}
.zone .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0}
.zone.on .ck{background:var(--cedar);border-color:var(--cedar);box-shadow:inset 0 0 0 3px #fff}
.bigchoice{display:grid;gap:12px}
.bigchoice button{display:flex;align-items:center;gap:14px;text-align:left;padding:18px;border-radius:18px;border:2px solid var(--line);background:#fff}
.bigchoice button .e{font-size:2rem}
.bigchoice button b{display:block;font-size:1.05rem}
.bigchoice button span{font-size:.85rem;color:var(--muted)}
.bigchoice button.on{border-color:var(--cedar);background:var(--cedar-soft)}

/* ride detail */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--muted);margin:4px 0 12px}
.timeline{position:relative;padding-left:26px}
.timeline .stop{position:relative;padding-bottom:18px}
.timeline .stop:last-child{padding-bottom:0}
.timeline .stop::before{content:"";position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;border:3px solid var(--cedar);background:#fff}
.timeline .stop.end::before{background:var(--red);border-color:var(--red)}
.timeline::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:3px;background:var(--cedar-soft);border-radius:2px}
.timeline .t{font-weight:800;font-size:1.05rem}
.timeline .s{font-size:.82rem;color:var(--muted)}
.person{display:flex;align-items:center;gap:12px;padding:10px 0}
.person+.person{border-top:1px solid var(--line)}
.person .n{flex:1;font-weight:600}
.person .n small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.seatbig{display:flex;gap:8px;margin-top:8px}
.seatbig i{width:38px;height:38px;border-radius:10px;background:var(--cedar);display:grid;place-items:center;font-style:normal;color:#fff;font-size:.9rem}
.seatbig i.free{background:#fff;border:2px dashed var(--cedar);color:var(--cedar)}
.actionbar{position:sticky;bottom:calc(var(--tab-h) + 10px + env(safe-area-inset-bottom));margin-top:16px;z-index:5}
.fuel{display:flex;align-items:center;gap:10px;margin-top:10px}
.fuel .text{width:110px;padding:10px}
.fuel .res{font-weight:800;color:var(--cedar-dark)}

/* chat */
.msgs{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;padding:4px 2px 10px}
.bubble{max-width:80%;padding:8px 12px;border-radius:16px;background:#f2efe8;font-size:.9rem;align-self:flex-start}
.bubble b{display:block;font-size:.7rem;color:var(--cedar-dark)}
.bubble.me{align-self:flex-end;background:var(--cedar);color:#fff}
.bubble.me b{color:#cdeedb}
.bubble .tm{font-size:.62rem;opacity:.6;margin-left:6px}
.composer{display:flex;gap:8px}
.composer .text{padding:12px}
.composer .btn{padding:0 16px}

/* sheet / modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,30,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:#dcdcdc;margin:0 auto 14px}
.sheet h2{font-size:1.25rem;margin-bottom:4px}
.plushead{background:linear-gradient(135deg,#e63946,#c81d2c);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.plushead .price{font-size:2.2rem;font-weight:800;line-height:1.1;margin-top:6px}
.plushead .price small{font-size:.9rem;font-weight:500;opacity:.85}
.perk{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.perk+.perk{border-top:1px solid var(--line)}
.perk .e{font-size:1.3rem;width:30px;text-align:center}
.perk b{display:block;font-size:.95rem}
.perk span{font-size:.8rem;color:var(--muted)}
.democ{font-size:.72rem;color:var(--muted);text-align:center;margin-top:10px}
.burst{text-align:center;padding:20px 0 6px}
.burst .e{font-size:3.4rem;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* me */
.profile{display:flex;gap:14px;align-items:center}
.profile .n{font-size:1.25rem;font-weight:800}
.menu{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;text-align:left;font-weight:600}
.menu button+button{border-top:1px solid var(--line)}
.menu button .chev{margin-left:auto;color:#b6bcc4}
.menu button.red{color:var(--red)}
.pluscard{background:linear-gradient(135deg,#e63946,#c81d2c);color:#fff;border-radius:var(--radius);padding:18px}
.pluscard h3{font-size:1.1rem}
.pluscard ul{list-style:none;margin:10px 0 14px;font-size:.88rem}
.pluscard li{padding:3px 0}
.pluscard .btn{background:#fff;color:var(--red)}
.impact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.impact .card{text-align:center;padding:14px}
.impact b{display:block;font-size:1.6rem;color:var(--cedar-dark)}
.impact span{font-size:.78rem;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:.9rem;z-index:90;animation:toast 2.6s ease forwards;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.splash{min-height:100dvh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.spinner{width:34px;height:34px;border:4px solid var(--cedar-soft);border-top-color:var(--cedar);border-radius:50%;animation:spin 1s linear infinite;margin:14px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.modebar{position:fixed;left:10px;bottom:calc(var(--tab-h) + 10px + env(safe-area-inset-bottom));background:#fff3cd;color:#7a5b00;font-size:.68rem;font-weight:600;border-radius:999px;padding:3px 10px;z-index:25;pointer-events:none}
.screen ~ .modebar{bottom:10px;left:auto;right:12px}

/* ====================== BIG SCREEN ====================== */
.screen{display:grid;grid-template-columns:clamp(260px,22vw,340px) 1fr;height:100vh;overflow:hidden}
.side{background:var(--cedar);color:#fff;padding:clamp(18px,2.4vh,30px) clamp(18px,1.6vw,28px);display:flex;flex-direction:column;gap:clamp(12px,2vh,22px);overflow:hidden}
.side .brand{color:#fff;font-size:1.5rem}
.side .brand .logo{background:#fff}
.side .scan{font-weight:700;font-size:1.05rem}
.qrbox{background:#fff;border-radius:18px;padding:12px;display:grid;place-items:center;margin-top:8px}
.qrbox img,.qrbox canvas{width:100%!important;height:auto!important;max-height:30vh;object-fit:contain}
.side .url{font-size:.8rem;opacity:.85;word-break:break-all;margin-top:6px}
.side .count{font-size:clamp(2.6rem,6vh,4rem);font-weight:800;line-height:1}
.side .count small{display:block;font-size:.95rem;font-weight:500;opacity:.85}
.conn{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;width:max-content}
.conn i{width:9px;height:9px;border-radius:50%;background:#7CF0A8;box-shadow:0 0 0 0 rgba(124,240,168,.7);animation:pulse 1.8s infinite}
.conn.off i{background:#f6c35b;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(124,240,168,0)}100%{box-shadow:0 0 0 0 rgba(124,240,168,0)}}
.tools{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}
.tools button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:7px 11px;font-size:.78rem;font-weight:600}
.tools button.on{background:#fff;color:var(--cedar)}
.main{padding:clamp(16px,2.4vh,28px) clamp(18px,2vw,34px);display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px);overflow:hidden;min-height:0}
.mhead{display:flex;align-items:center;gap:16px}
.mhead h1{font-size:clamp(1.4rem,2.6vw,2.1rem);letter-spacing:-.02em;line-height:1.1}
.mhead .clock{margin-left:auto;font-weight:700;color:var(--muted);font-size:1.05rem}
.stabs{display:flex;gap:8px}
.stabs button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;color:var(--muted);font-size:.9rem}
.stabs button.on{border-color:var(--cedar);color:var(--cedar);background:var(--cedar-soft)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,1vw,14px)}
.stat{background:#fff;border-radius:16px;padding:clamp(10px,1.5vh,16px) clamp(12px,1vw,18px);box-shadow:var(--shadow)}
.stat b{display:block;font-size:clamp(1.6rem,4.2vh,2.5rem);line-height:1.1;color:var(--cedar-dark)}
.stat.red b{color:var(--red)}
.stat span{font-size:clamp(.72rem,1.5vh,.88rem);color:var(--muted);font-weight:500}
.stat b.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.18);color:var(--red)}}
.board{display:grid;grid-template-columns:1.45fr 1fr;gap:clamp(10px,1.2vw,18px);flex:1;min-height:0}
.panel{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:clamp(12px,1.8vh,18px);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel h2{font-size:clamp(.95rem,1.9vh,1.1rem);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.panel h2 .n{margin-left:auto;font-size:.8rem;color:var(--muted);font-weight:600}
.deps{overflow:hidden;flex:1}

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const zone = id => ZONES.find(z => z.id === id) || { id, name:id, towns:"" };
const tmin = t => { const [h,m] = String(t).split(":").map(Number); return h*60 + (m||0); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const plural = (n, w, p) => `${n} ${n===1 ? w : (p || w+"s")}`;
const AV_COLORS = ["#0f7b4a","#e63946","#2a6f97","#f4a72a","#7b4ea3","#0a5534","#d65a31","#3d8b7d"];
const avColor = s => { let h=0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; };
const initials = n => String(n||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
function ago(t){ const s = Math.max(0, (Date.now()-t)/1000|0); if (s<45) return "just now"; if (s<3600) return Math.round(s/60)+"m ago"; return Math.round(s/3600)+"h ago"; }
function setHTML(el, html){ if (el && el._h !== html){ el.innerHTML = html; el._h = html; } }

  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>',
};

/* =========================================================
   DATABASE (Firebase live, or local demo across tabs)
   All data lives under v2/: users, rides, requests, chats, feed
   ========================================================= */
function liveDB(){
  firebase.initializeApp(firebaseConfig);
  const root = firebase.database().ref("v2");
  return {
    on: f => root.on("value", s => f(s.val() || {})),
    set: (p,v) => root.child(p).set(v),
    update: (p,o) => root.child(p).update(o),
    push: (p,v) => { const r = root.child(p).push(); r.set(v); return r.key; },
    remove: p => root.child(p).remove(),
    reset: () => root.remove(),
    // Atomic seat booking: never lets a car go over its seat count.
    join: (rid, uid) => root.child("rides/"+rid).transaction(r => {
      if (r === null) return null;
      const ps = r.passengers || {};
      if (ps[uid]) return r;
      if (Object.keys(ps).length >= r.seats) return;   // abort: full
      ps[uid] = { at: Date.now() }; r.passengers = ps; return r;
    }).then(res => { const v = res.snapshot.val(); return !!(res.committed && v && v.passengers && v.passengers[uid]); }),
    onConn: f => firebase.database().ref(".info/connected").on("value", s => f(!!s.val())),
  };
}
function demoDB(){
  const KEY = "sadik2-demo";
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } };
  const cbs = [];
  const emit = () => { const t = read(); cbs.forEach(f => f(t)); };
  const write = t => { localStorage.setItem(KEY, JSON.stringify(t)); emit(); };
  const parts = p => String(p).split("/").filter(Boolean);
  const setIn = (t,p,v) => { const ks = parts(p); let o = t; for (let i=0;i<ks.length-1;i++){ if (!o[ks[i]] || typeof o[ks[i]] !== "object") o[ks[i]] = {}; o = o[ks[i]]; } const k = ks[ks.length-1]; if (v === null || v === undefined) delete o[k]; else o[k] = v; };
  const getIn = (t,p) => parts(p).reduce((o,k) => o && o[k], t);
  window.addEventListener("storage", e => { if (e.key === KEY) emit(); });
  const done = Promise.resolve();
  return {
    on: f => { cbs.push(f); setTimeout(() => f(read()), 0); },
    set: (p,v) => { const t = read(); setIn(t,p,v); write(t); return done; },
    update: (p,o) => { const t = read(); Object.entries(o).forEach(([k,v]) => setIn(t, p+"/"+k, v)); write(t); return done; },
    push: (p,v) => { const id = "k"+newId(); const t = read(); setIn(t, p+"/"+id, v); write(t); return id; },
    remove: p => { const t = read(); setIn(t,p,null); write(t); return done; },
    reset: () => { write({}); return done; },
    join: (rid, uid) => { const t = read(); const r = getIn(t, "rides/"+rid); if (!r) return Promise.resolve(false); const ps = r.passengers || {}; if (!ps[uid] && Object.keys(ps).length >= r.seats) return Promise.resolve(false); ps[uid] = ps[uid] || { at: Date.now() }; r.passengers = ps; write(t); return Promise.resolve(true); },
    onConn: f => f(true),
  };
}
let DB;
try { DB = LIVE ? liveDB() : demoDB(); } catch(e){ console.error(e); DB = demoDB(); }

/* =========================================================
   STATE + DERIVED DATA
   ========================================================= */
let T = {};            // whole v2 tree
let loaded = false;
const users = () => T.users || {};
const uname = id => (users()[id] || {}).name || "Someone";
const isPlus = id => !!(users()[id] || {}).plus;
function allRides(){
  return Object.entries(T.rides || {}).map(([id, r]) => {
    const ps = Object.entries(r.passengers || {}).map(([uid, v]) => ({ uid, ...(typeof v === "object" ? v : { at:v }) })).sort((a,b) => a.at-b.at);
    return { ...r, id, ps, left: Math.max(0, (r.seats||0) - ps.length) };
  }).filter(r => r.driver && r.zone && r.time).sort((a,b) => tmin(a.time)-tmin(b.time) || a.at-b.at);
}
function requestGroups(){
  const map = {};
  Object.entries(T.requests || {}).forEach(([uid, r]) => { if (!r || !r.zone) return; const k = r.zone+"~"+r.time; (map[k] = map[k] || { zone:r.zone, time:r.time, uids:[] }).uids.push(uid); });
  return Object.values(map).sort((a,b) => b.uids.length-a.uids.length || tmin(a.time)-tmin(b.time));
}
function feed(icon, text){ DB.push("feed", { icon, text, at: Date.now() }); }

/* =========================================================
   SHARED UI PIECES
   ========================================================= */
function avatar(id, cls=""){ const n = uname(id); return `<span class="av ${cls} ${isPlus(id)?"star":""}" style="background:${avColor(id)}" title="${esc(n)}">${esc(initials(n))}</span>`; }
function seatDots(r){ return `<span class="seatdots">${Array.from({length:r.seats}, (_,i) => `<i class="${i < r.ps.length ? "" : "free"}"></i>`).join("")}</span>`; }

function toast(msg){ $$(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2700); }

function openSheet(html, onMount){
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  o.addEventListener("click", e => { if (e.target === o) close(); });
  onMount && onMount($(".sheet", o), close);
  return close;
}
// Two-tap confirm for destructive actions (no browser dialogs).
function confirmTap(btn, armedLabel, action){
  btn.onclick = () => {   // assigned (not added) so re-renders never stack handlers
    if (btn.dataset.armed){ action(); return; }
    btn.dataset.armed = "1"; const old = btn.innerHTML; btn.innerHTML = armedLabel;
    setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; btn.innerHTML = old; } }, 3000);
  };
}

function zonePicker(current, onPick){
  openSheet(`<h2>Where from?</h2><p class="muted small" style="margin-bottom:14px">Pick the area closest to home.</p>
    <div class="zonelist">${ZONES.map(z => `<button class="zone ${z.id===current?"on":""}" data-z="${z.id}"><div><b>${z.name}</b><span>${z.towns}</span></div><i class="ck"></i></button>`).join("")}</div>`,
    (sh, close) => $$(".zone", sh).forEach(b => b.onclick = () => { close(); onPick(b.dataset.z); }));
}
function timePicker(title, current, onPick){
  openSheet(`<h2>${esc(title)}</h2><p class="muted small" style="margin-bottom:14px">Morning departure to ${DEST}.</p>
    <div class="grid3">${TIMES.map(t => `<button class="chip ${t===current?"on":""}" data-t="${t}">${t}</button>`).join("")}</div>`,
    (sh, close) => $$(".chip", sh).forEach(b => b.onclick = () => { close(); onPick(b.dataset.t); }));
}

/* ---------- Sadik Plus ---------- */
const PERKS = [
  ["⛽","Fuel-split calculator","Everyone sees exactly what to pay the driver"],
  ["✅","Verified USJ students only","Filter rides to verified classmates"],
  ["📅","Book your seat for the week","Keep your seat Monday to Friday"],
  ["⏰","Ride reminders","A reminder the night before you ride"],
];
function openPlus(after){
  const uid = App.uid;
  openSheet(`<div class="plushead"><div style="font-weight:700;opacity:.9">⭐ Sadik Plus</div><div class="price">$2 <small>/ month · or $10 per semester</small></div><div class="small" style="opacity:.9;margin-top:4px">One shared ride saves more than that in gas.</div></div>
    <div>${PERKS.map(p => `<div class="perk"><div class="e">${p[0]}</div><div><b>${p[1]}</b><span>${p[2]}</span></div></div>`).join("")}</div>
    <button class="btn primary block" id="buy" style="margin-top:14px">Get Plus · ${PRICE}</button>
    <button class="btn block" id="later" style="color:var(--muted);margin-top:4px">Maybe later</button>
    <p class="democ">Class demo: no real payment is taken.</p>`,
    (sh, close) => {
      $("#later", sh).onclick = close;
      $("#buy", sh).onclick = () => {
        DB.update("users/"+uid, { plus: true, plusAt: Date.now() });
        feed("⭐", `${uname(uid)} got Sadik Plus`);
        sh.innerHTML = `<div class="grab"></div><div class="burst"><div class="e">🎉</div><h2 style="margin-top:8px">Welcome to Plus!</h2><p class="muted" style="margin:6px 0 18px">All Plus features are unlocked. Yalla!</p></div><button class="btn green block" id="ok">Done</button>`;
        $("#ok", sh).onclick = () => { close(); after && after(); };
      };
    });
}
function requirePlus(fn){ if (isPlus(App.uid)) fn(); else openPlus(fn); }

/* ---------- ride card ---------- */
function rideCard(r, uid){
  const mine = r.driver === uid, riding = r.ps.some(p => p.uid === uid);
  const status = mine ? `<span class="status mine">You drive</span>` : riding ? `<span class="status mine">You're in</span>`
    : r.left ? `<span class="status ok">${plural(r.left,"seat")} left</span>` : `<span class="status full">Full</span>`;
  return `<button class="ride" data-ride="${r.id}">
    <div class="time">${r.time}<small>${r.weekly ? "Mon–Fri" : "Tomorrow"}</small></div>
    <div style="min-width:0">
      <div class="who">${avatar(r.driver)}<span>${esc(uname(r.driver))}</span>${isPlus(r.driver) ? '<span class="tagv">✓ Verified</span>' : ""}</div>
      <div class="route">${esc(zone(r.zone).name)} → ${DEST}</div>
      ${r.note ? `<div class="note">📍 ${esc(r.note)}</div>` : ""}
    </div>
    <div class="rside">${seatDots(r)}${status}${r.ps.length ? `<div class="avstack" style="justify-content:flex-end;margin-top:6px">${r.ps.slice(0,4).map(p => avatar(p.uid)).join("")}</div>` : ""}</div>
  </button>`;
}
function bindRideCards(el){ $$("[data-ride]", el).forEach(b => b.onclick = () => go("ride/"+b.dataset.ride)); }

/* =========================================================
   PHONE APP
   ========================================================= */
const App = {
  uid: localStorage.getItem(UID_KEY),
  view: null,
  me(){ return this.uid && users()[this.uid] ? { id:this.uid, ...users()[this.uid] } : null; },
};
function go(hash){ if (location.hash.slice(1) === hash) mount(); else location.hash = hash; }
function route(){ const h = decodeURIComponent(location.hash.slice(1)) || "find"; const i = h.indexOf("/"); return i < 0 ? { name:h, arg:"" } : { name:h.slice(0,i), arg:h.slice(i+1) }; }

function appShell(){
  $("#root").innerHTML = `<div id="app">
    <header class="topbar" id="topbar"></header>
    <main id="view"></main>
    <nav class="tabbar" id="tabbar" role="tablist">
      <button class="tab" data-tab="find">${ICON.search}<span>Find</span></button>
      <button class="tab" data-tab="offer">${ICON.plus}<span>Offer</span></button>
      <button class="tab" data-tab="rides">${ICON.car}<span>My rides</span><span class="badge hidden" id="ridesBadge"></span></button>
      <button class="tab" data-tab="me">${ICON.user}<span>Me</span></button>
    </nav>
  </div>${LIVE ? "" : '<div class="modebar">Demo mode: data stays on this computer</div>'}`;
  $$(".tab").forEach(t => t.onclick = () => go(t.dataset.tab));
}
function renderChrome(){
  const me = App.me(); if (!me) return;
  setHTML($("#topbar"), `<div class="brand"><div class="logo">🌲</div><span>Sa<em>dik</em></span></div>
    <div class="right">${KIOSK ? `<button class="pill ghost" id="nextPerson">↻ Next person</button>` : ""}
    ${me.plus ? `<button class="pill plus" id="plusPill">⭐ Plus</button>` : `<button class="pill get" id="plusPill">Get Plus</button>`}</div>`);
  const pp = $("#plusPill"); if (pp) pp.onclick = () => me.plus ? go("me") : openPlus();
  const np = $("#nextPerson"); if (np) np.onclick = signOut;
  const r = route().name;
  $$(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === (r === "ride" ? App.lastTab || "find" : r)));
  const n = allRides().filter(x => x.driver === me.id || x.ps.some(p => p.uid === me.id)).length + ((T.requests||{})[me.id] ? 1 : 0);
  const b = $("#ridesBadge"); b.textContent = n; b.classList.toggle("hidden", !n);
}
function signOut(){ localStorage.removeItem(UID_KEY); App.uid = null; FindView.reset(); OfferView.reset(); $$(".overlay").forEach(o => o.remove()); if (location.hash) location.hash = ""; else mount(); }

function mount(){
  if (MODE !== "app") return;
  const root = $("#root");
  if (!loaded){ root.innerHTML = `<div class="splash"><div><div class="brand" style="justify-content:center"><div class="logo">🌲</div><span>Sa<em>dik</em></span></div><div class="spinner"></div><div class="small" id="splashMsg">Connecting…</div></div></div>`; return; }
  if (!App.me()){ App.view = null; Onboarding.mount(root); return; }
  if (!$("#app")) appShell();
  const r = route();
  const V = { find:FindView, offer:OfferView, rides:RidesView, me:MeView, ride:RideView }[r.name] || FindView;
  if (r.name !== "ride") App.lastTab = r.name in { find:1, offer:1, rides:1, me:1 } ? r.name : "find";
  const el = $("#view"); el.innerHTML = ""; el._h = null; el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
  App.view = V; V.mount(el, r.arg); V.update && V.update();
  renderChrome(); window.scrollTo(0,0);
}
function refresh(){
  if (MODE !== "app") return;
  if (!App.me() || !$("#app")) { mount(); return; }
  renderChrome(); App.view && App.view.update && App.view.update();
}

/* ---------- Onboarding: name, area, time, driver ---------- */
const Onboarding = {
  step: 0, d: { name:"", zone:null, time:"8:00", drives:null },
  mount(root){ this.root = root; this.render(); },
  render(){
    const s = this.step, d = this.d, total = 4;
    const bar = s ? `<div class="bar"><i style="width:${s/total*100}%"></i></div>` : "";
    let body = "", canNext = true;
    if (s === 0){
      this.root.innerHTML = `<div class="onb enter"><div class="brand"><div class="logo">🌲</div><span>Sa<em>dik</em></span></div>
        <div class="hero"><div class="art">🚗💨</div><h1>Your ride to USJ,<br>with friends.</h1><p>Find classmates who live near you and leave at the same time. Share the ride, split the fuel.</p></div>
        <button class="btn primary block" id="start">Get started</button>
        <p class="democ">Takes 15 seconds · only your first name</p></div>`;
      $("#start").onclick = () => { this.step = 1; this.render(); };
      return;
    }

function joinRide(rid){
  const uid = App.uid, before = allRides();
  DB.join(rid, uid).then(ok => {
    if (!ok){ toast("Sorry, this car just filled up"); return; }
    const r = allRides().find(x => x.id === rid) || before.find(x => x.id === rid);
    // One morning ride per person: leave any other car at the same time.
    before.filter(x => x.id !== rid && x.time === r.time && x.ps.some(p => p.uid === uid)).forEach(x => DB.remove(`rides/${x.id}/passengers/${uid}`));
    if ((T.requests||{})[uid]) DB.remove("requests/"+uid);
    feed("🤝", `${uname(uid)} joined ${uname(r.driver)}'s ${r.time} ride`);
    toast("You're in! 🎉 Say hi in the group chat.");
  });
}
async function shareApp(text){
  const url = location.origin + location.pathname;
  if (navigator.share){ try { await navigator.share({ title:"Sadik", text, url }); return; } catch(e){} }
  try { await navigator.clipboard.writeText(`${text} ${url}`); toast("Link copied ✅"); } catch(e){ toast(url); }
}

    const driving = rs.filter(r => r.driver === uid), riding = rs.filter(r => r.ps.some(p => p.uid === uid)), req = (T.requests||{})[uid];

      setHTML($("#mrBody"), `<div class="card empty" style="margin-top:16px"><div class="big">🪑</div><h3>No rides yet</h3><p>Find a classmate driving your way, or offer your empty seats.</p><div class="row2"><button class="btn primary" data-go="find">Find a ride</button><button class="btn soft" data-go="offer">Offer a ride</button></div></div>`);
    } else {
      const carsSaved = driving.reduce((s,r) => s + r.ps.length, 0) + riding.length;
      const people = new Set([...driving.flatMap(r => r.ps.map(p => p.uid)), ...riding.flatMap(r => [r.driver, ...r.ps.map(p => p.uid)])]); people.delete(uid);
      let h = `<div class="impact" style="margin-top:14px"><div class="card"><b>${carsSaved}</b><span>${carsSaved===1?"car":"cars"} off the road tomorrow</span></div><div class="card"><b>${people.size}</b><span>classmates you ride with</span></div></div>`;
      if (req){
        const m = rs.filter(r => r.zone === req.zone && r.time === req.time && r.left).length;
        h += `<h2 class="section">Waiting for a driver</h2><div class="waiting"><span class="ico">⏳</span><div style="flex:1"><b>${esc(zone(req.zone).name)} · ${req.time}</b><span class="small muted">${m ? `${plural(m,"ride")} match your request` : "Drivers can see your request"}</span></div><button class="link small" id="mrCancel">Cancel</button></div>`;
      }
      if (driving.length) h += `<h2 class="section">You're driving</h2><div class="stack">${driving.map(r => rideCard(r, uid)).join("")}</div>`;
      if (riding.length) h += `<h2 class="section">You're riding</h2><div class="stack">${riding.map(r => rideCard(r, uid)).join("")}</div>`;
      setHTML($("#mrBody"), h);
      const c = $("#mrCancel"); if (c) c.onclick = () => { DB.remove("requests/"+uid); toast("Request cancelled"); };
      bindRideCards($("#mrBody"));
    }
    $$("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  }
};

    const tick = () => { $("#clock").textContent = new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }; tick(); setInterval(tick, 15000);

    setHTML($("#map"), svg);

    // waiting list
    const groups = requestGroups(), waitN = groups.reduce((s,g) => s + g.uids.length, 0);

    this.renderTicker();

  }
};

/* ---------- rehearsal simulator: behaves like real classmates ---------- */
const FAKE = ["Maya","Karim","Rita","Elie","Nour","Joe","Lea","Charbel","Yara","Marc","Tia","Ralph","Christa","Georges","Sara","Hadi","Perla","Anthony"];
function simulate(){
  const us = users(), rs = allRides(), reqs = T.requests || {};
  const busy = new Set([...rs.map(r => r.driver), ...rs.flatMap(r => r.ps.map(p => p.uid)), ...Object.keys(reqs)]);
  const idle = Object.keys(us).filter(u => !busy.has(u) && u.startsWith("sim"));
  const open = rs.filter(r => r.left);
  const roll = Math.random();
  const zones4 = ["metn-coast","upper-metn","beirut","keserwan","baabda"], times = ["7:30","8:00","8:30"];
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const used = new Set(Object.values(us).map(u => u.name));
  const newUser = drives => { const name = FAKE.find(n => !used.has(n)) || pick(FAKE)+" "+(Object.keys(us).length+1); const uid = "sim"+newId(); const z = pick(zones4), t = pick(times);
    DB.set("users/"+uid, { name, zone:z, time:t, drives, at:Date.now() }); feed("👋", `${name} joined from ${zone(z).name}`); T.users = { ...us, [uid]: { name, zone:z, time:t, drives } }; return uid; };
  // 1) a rider asking or joining
  if (open.length && (roll < .45 || idle.length)){
    const uid = idle.find(u => !us[u].drives) || newUser(false), r = open.find(x => x.zone === (users()[uid]||{}).zone) || pick(open);
    DB.join(r.id, uid).then(ok => { if (ok){ DB.remove("requests/"+uid); feed("🤝", `${uname(uid)} joined ${uname(r.driver)}'s ${r.time} ride`); } });
    return;
  }
  // 2) a new driver, often answering a request
  if (roll < .75 || !rs.length){
    const g = requestGroups()[0]; const uid = newUser(true); const z = g ? g.zone : us[uid] ? us[uid].zone : pick(zones4); const t = g ? g.time : pick(times); const seats = 2 + Math.floor(Math.random()*3);
    const notes = ["", "Main roundabout", "Near the church", "Gas station on the highway", ""];
    const rid = DB.push("rides", { driver:uid, zone:z, time:t, seats, note:pick(notes), weekly:false, at:Date.now() });
    feed("🚗", `${uname(uid)} offered ${plural(seats,"seat")} from ${zone(z).name} at ${t}`);
    if (g) setTimeout(() => g.uids.slice(0,seats).forEach(u => DB.join(rid, u).then(ok => { if (ok){ DB.remove("requests/"+u); feed("🤝", `${uname(u)} joined ${uname(uid)}'s ${t} ride`); } })), 900);
    return;
  }
  // 3) someone asks for a ride, or buys Plus
  if (roll < .9){ const uid = newUser(false), u = users()[uid] || {}; DB.set("requests/"+uid, { zone:u.zone || "metn-coast", time:u.time || "8:00", at:Date.now() }); feed("🙋", `${uname(uid)} is looking for a ride from ${zone(u.zone).name} at ${u.time}`); return; }
  const np = Object.keys(us).filter(u => !us[u].plus); if (np.length){ const u = pick(np); DB.update("users/"+u, { plus:true }); feed("⭐", `${uname(u)} got Sadik Plus`); }
}
